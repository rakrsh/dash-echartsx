[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dash-echartsx"
version = "0.1.0"
description = "Apache ECharts components for Plotly Dash"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["dash>=2.14"]

[dependency-groups]
dev = ["dash[testing]>=2.14", "pytest>=8", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["dash_echartsx"]
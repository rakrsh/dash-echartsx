[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dash-echartsx"
version = "0.1.0"
description = "Apache ECharts components for Plotly Dash"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["dash>=2.14"]

[dependency-groups]
dev = ["dash[testing]>=2.14", "pytest>=8", "pyyaml>=6", "ruff>=0.11", "black>=25"]

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["dash_echartsx/DashEChartsX.py", "dash_echartsx/_imports_.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 88
target-version = ["py39"]
extend-exclude = '(?x)(/DashEChartsX\.py|/_imports_\.py)$'

[tool.hatch.build.targets.wheel]
packages = ["dash_echartsx"]
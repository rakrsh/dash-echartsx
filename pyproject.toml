[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dash-echartsx"
version = "0.1.0"
description = "Apache ECharts components for Plotly Dash"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["dash>=2.14"]

[dependency-groups]
test = [
	"dash[testing]>=4.5.0rc0",
	"chromedriver-autoinstaller>=0.6.4",
	"pytest>=8",
	"selenium>=4.14.0",
]
automation = ["pyyaml>=6"]
docs = ["furo>=2024.8.6", "sphinx>=7.4,<9"]
lint = ["black>=25", "ruff>=0.11"]
dev = [
	{ include-group = "test" },
	{ include-group = "automation" },
	{ include-group = "lint" },
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["dash_echartsx/DashEChartsX.py", "dash_echartsx/_imports_.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '(?x)(/DashEChartsX\.py|/_imports_\.py)$'

[tool.hatch.build.targets.wheel]
packages = ["dash_echartsx"]
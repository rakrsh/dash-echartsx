    <text x="127" y="83" fill="#f1f5fb" font-size="22" font-weight="720">DashEChartsX</text>
    <text x="68" y="151" fill="#72d7c2" font-size="15" font-weight="750" letter-spacing="2.2">PYTHON-FIRST VISUALIZATION</text>
    <text x="68" y="225" fill="#f5f8fc" font-size="53" font-weight="760" letter-spacing="-1.8">Apache ECharts.</text>
    <text x="68" y="285" fill="#f5f8fc" font-size="53" font-weight="760" letter-spacing="-1.8">At home in Dash.</text>
    <text x="70" y="333" fill="#b7c5d8" font-size="20">Keep the expressive ECharts option model.</text>
    <text x="70" y="362" fill="#b7c5d8" font-size="20">Build interactive chart apps with Python.</text>
    <rect x="68" y="411" width="266" height="48" rx="24" fill="#182a41" stroke="#355271"/>
    <text x="201" y="441" text-anchor="middle" fill="#dce9f8" font-size="16" font-weight="650">Apache ECharts 5.6+ and 6</text>
    <text x="68" y="550" fill="#8396ae" font-size="14" letter-spacing="1.5">OPEN SOURCE · DASH COMPONENT · RESPONSIVE CHARTS</text>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">DashEChartsX: Apache ECharts for Plotly Dash</title>
  <desc id="desc">A feature banner showing a sample chart and the connection between Apache ECharts and Python Dash.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#14243b"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4992ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4992ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8aa0bd" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <circle cx="1080" cy="38" r="300" fill="#28577b" opacity=".16"/>
  <rect width="1200" height="627" fill="url(#grid)"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DashEChartsX brings Apache ECharts to Python Dash</title>
  <desc id="desc">A wide feature graphic with a sample trend chart and DashEChartsX branding.</desc>
  <defs>

      <stop offset="0" stop-color="#0b1120"/>
      <stop offset=".58" stop-color="#14243b"/>
      <stop offset="1" stop-color="#17314a"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4992ff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4992ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8aa0bd" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

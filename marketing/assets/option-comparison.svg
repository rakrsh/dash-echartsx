<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">ECharts JavaScript and DashEChartsX Python comparison</title>
  <desc id="desc">The same small line-chart option is shown in JavaScript ECharts and in a Python DashEChartsX app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#152b43"/>
    </linearGradient>
  </defs>
  <rect width="1800" height="1120" fill="url(#bg)"/>
  <circle cx="1690" cy="50" r="340" fill="#28577b" opacity=".14"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="76" y="62" width="48" height="48" rx="14" fill="#ef5271"/>
    <text x="100" y="93" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">DX</text>
    <text x="141" y="93" fill="#f1f5fb" font-size="22" font-weight="720">DashEChartsX</text>
    <text x="76" y="174" fill="#72d7c2" font-size="16" font-weight="750" letter-spacing="2">SAME OPTION MODEL · TWO APP CONTEXTS</text>
    <text x="76" y="240" fill="#f5f8fc" font-size="50" font-weight="760" letter-spacing="-1.6">Keep the chart option. Choose your app stack.</text>
    <rect x="70" y="292" width="800" height="700" rx="20" fill="#101827" stroke="#34465f" stroke-width="2"/>
    <rect x="930" y="292" width="800" height="700" rx="20" fill="#101827" stroke="#345a57" stroke-width="2"/>
    <rect x="102" y="326" width="735" height="56" rx="12" fill="#19263a"/>
    <rect x="962" y="326" width="735" height="56" rx="12" fill="#172d32"/>
    <text x="126" y="362" fill="#dce6f2" font-size="20" font-weight="700">ECharts JavaScript</text>
    <text x="986" y="362" fill="#dce6f2" font-size="20" font-weight="700">DashEChartsX Python</text>
  </g>
  <g font-family="Consolas, 'SFMono-Regular', monospace" font-size="18" xml:space="preserve">
    <text x="108" y="438" fill="#72d7c2">const option = {</text>
    <text x="108" y="475" fill="#a8b8ce">  tooltip: { trigger: "axis" },</text>
    <text x="108" y="512" fill="#a8b8ce">  xAxis: { type: "category", data: labels },</text>
    <text x="108" y="549" fill="#a8b8ce">  yAxis: { type: "value" },</text>
    <text x="108" y="586" fill="#a8b8ce">  series: [</text>
    <text x="108" y="623" fill="#fddd60">    { name: "Actual", type: "line", data: actual },</text>
    <text x="108" y="660" fill="#fddd60">    { name: "Target", type: "line", data: target },</text>
    <text x="108" y="697" fill="#a8b8ce">  ],</text>
    <text x="108" y="734" fill="#72d7c2">};</text>
    <text x="108" y="808" fill="#dce6f2">const chart = echarts.init(node);</text>
    <text x="108" y="845" fill="#dce6f2">chart.setOption(option);</text>
  </g>
  <g font-family="Consolas, 'SFMono-Regular', monospace" font-size="18" xml:space="preserve" transform="translate(0,-18)">
    <text x="968" y="438" fill="#72d7c2">from dash import Dash</text>
    <text x="968" y="475" fill="#72d7c2">from dash_echartsx import DashEChartsX</text>
    <text x="968" y="530" fill="#dce6f2">app = Dash(__name__)</text>
    <text x="968" y="567" fill="#72d7c2">option = {</text>
    <text x="968" y="604" fill="#a8b8ce">  "tooltip": {"trigger": "axis"},</text>
    <text x="968" y="641" fill="#a8b8ce">  "xAxis": {"type": "category", "data": labels},</text>
    <text x="968" y="678" fill="#a8b8ce">  "yAxis": {"type": "value"},</text>
    <text x="968" y="715" fill="#a8b8ce">  "series": [</text>
    <text x="968" y="752" fill="#fddd60">    {"name": "Actual", "type": "line", "data": actual},</text>
    <text x="968" y="789" fill="#fddd60">    {"name": "Target", "type": "line", "data": target},</text>
    <text x="968" y="826" fill="#a8b8ce">  ],</text>
    <text x="968" y="863" fill="#72d7c2">}</text>
    <text x="968" y="900" fill="#dce6f2">app.layout = DashEChartsX(</text>
    <text x="968" y="937" fill="#a8b8ce">  id="trend", option=option,</text>
    <text x="968" y="974" fill="#a8b8ce">  style={"width": "100%", "height": "60vh"})</text>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="76" y="1016" fill="#f5f8fc" font-size="23" font-weight="700">The ECharts option structure stays familiar.</text>
    <text x="76" y="1054" fill="#aab8cc" font-size="19">DashEChartsX adds a Python app layout and Dash callbacks around it.</text>
    <text x="1724" y="1054" text-anchor="end" fill="#72d7c2" font-size="17" font-weight="700">dash-echartsx</text>
  </g>
</svg>

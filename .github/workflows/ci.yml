name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13", "3.14"]
        echarts-version: ["5.6.0", "6.1.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false echarts@${{ matrix.echarts-version }}
          uv sync --group dev

      - name: Build Dash component and bundles
        run: npm run build

      - name: Frontend checks
        run: |
          npm test
          npm run lint
          npm run typecheck

      - name: Python checks
        run: |
          uv run ruff check .
          uv run black --check dash_echartsx tests scripts
          uv run pytest

  firefox-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION }}

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          uv sync --group dev

      - name: Build Dash component and bundles
        run: npm run build

      - name: Run headless Firefox integration tests
        env:
          CI: "true"
        run: uv run pytest -m "integration and not webgl" --webdriver Firefox

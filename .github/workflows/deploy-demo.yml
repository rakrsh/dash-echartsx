name: Deploy static gallery to Hugging Face Spaces

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "example_app/**"
      - "docs/_static/images/**"
      - ".github/workflows/deploy-demo.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate deployment settings
        env:
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_SPACE_ID" ]; then
            echo "::error::Set the HF_SPACE_ID repository secret."
            exit 1
          fi
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the HF_TOKEN repository secret."
            exit 1
          fi
      - name: Prepare static Space contents
        run: |
          set -euo pipefail
          space_dir="$RUNNER_TEMP/dash-echartsx-static-space"
          mkdir -p "$space_dir/assets"
          cp example_app/static_space/README.md "$space_dir/README.md"
          cp example_app/static_space/index.html "$space_dir/index.html"
          cp docs/_static/images/gallery-preview.png \
            docs/_static/images/gallery-catalog.png \
            docs/_static/images/bar-race.gif \
            docs/_static/images/financial-example.png \
            docs/_static/images/financial-zoom.gif \
            docs/_static/images/map-example.png \
            docs/_static/images/map-interaction.gif \
            "$space_dir/assets/"
      - name: Upload static gallery to Space
        env:
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          hf auth login --token "$HF_TOKEN"
          hf upload "$HF_SPACE_ID" "$RUNNER_TEMP/dash-echartsx-static-space" . \
            --repo-type space \
            --commit-message "Deploy static DashEChartsX gallery from ${GITHUB_SHA}"

name: Deploy demo to Hugging Face Spaces

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "example_app/**"
      - ".github/workflows/deploy-demo.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate deployment settings
        env:
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_SPACE_ID" ]; then
            echo "::error::Set the HF_SPACE_ID repository secret."
            exit 1
          fi
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the HF_TOKEN repository secret."
            exit 1
          fi
      - name: Upload gallery to Space
        env:
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          hf auth login --token "$HF_TOKEN"
          hf upload "$HF_SPACE_ID" example_app . \
            --repo-type space \
            --commit-message "Deploy DashEChartsX demo from ${GITHUB_SHA}"
